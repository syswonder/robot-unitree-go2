# Conservative Go2 Nav2 profile. The service-navigation wrapper replaces all
# __ROBONIX_* tokens from Atlas/Soma before launching Nav2.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.20
      allow_unknown: false
    tf_buffer_duration: 0.75

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: "__ROBONIX_ODOM_TOPIC__"
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.30
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["go2_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 20.0
    go2_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.25
      max_vel_y: 0.0
      max_vel_theta: 0.40
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.05
      acc_lim_x: 0.30
      acc_lim_y: 0.0
      acc_lim_theta: 0.80
      # The chassis uses one symmetric slew limit. Nav2 must not plan with a
      # shorter braking distance than the adapter can physically request.
      decel_lim_x: -0.30
      decel_lim_y: 0.0
      decel_lim_theta: -0.80
      vx_samples: 16
      vy_samples: 1
      vtheta_samples: 60
      sim_time: 2.0
      linear_granularity: 0.04
      angular_granularity: 0.04
      transform_tolerance: 0.30
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 1.0
      GoalAlign.scale: 0.30
      PathDist.scale: 0.60
      GoalDist.scale: 1.50
      RotateToGoal.xy_goal_tolerance: 0.20
      RotateToGoal.scale: 0.50
      RotateToGoal.slowing_factor: 2.0
      RotateToGoal.lookahead_time: 0.50

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: "__ROBONIX_ODOM_TOPIC__"
    # Humble reads default_nav_to_pose_bt_xml. Keep the legacy key pointed at
    # the same no-Spin/no-BackUp tree for older Nav2 compatibility.
    bt_loop_duration: 50
    default_server_timeout: 1000
    default_bt_xml_filename: "__ROBONIX_BT_XML__"
    default_nav_to_pose_bt_xml: "__ROBONIX_BT_XML__"
    tf_buffer_duration: 0.75

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4.0
      height: 4.0
      resolution: 0.05
      transform_tolerance: 0.30
      footprint: "__ROBONIX_FOOTPRINT__"
      footprint_padding: 0.05
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: "__ROBONIX_SCAN_TOPIC__"
          data_type: "LaserScan"
          clearing: true
          marking: true
          # The projector emits +Inf for empty rays. Accepting those rays is
          # required to clear an obstacle after it moves away.
          inf_is_valid: true
          observation_persistence: 0.0
          # A stale projected scan makes the layer non-current; the controller
          # then stops producing commands and the smoother/chassis watchdogs
          # drive the output to zero.
          expected_update_rate: 0.50
          obstacle_min_range: 0.0
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 9.0
          max_obstacle_height: 1.50
          # A projected LaserScan lies at z=0 in base_link. Any positive
          # minimum would silently reject every scan return.
          min_obstacle_height: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.65
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      resolution: 0.05
      transform_tolerance: 0.30
      track_unknown_space: true
      footprint: "__ROBONIX_FOOTPRINT__"
      footprint_padding: 0.05
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: "__ROBONIX_MAP_TOPIC__"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: "__ROBONIX_SCAN_TOPIC__"
          data_type: "LaserScan"
          clearing: true
          marking: true
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.50
          obstacle_min_range: 0.0
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 9.0
          max_obstacle_height: 1.50
          min_obstacle_height: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.75
        cost_scaling_factor: 3.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.30
    cycle_frequency: 5.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# navigation_launch.py always launches this node and remaps its output through
# service-navigation-rbnx's final velocity guard. Explicit limits are required:
# relying on distro defaults can either fail lifecycle configure or clamp every
# command to zero. The timeout provides an additional zero-command fail-safe.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 0.40]
    min_velocity: [0.0, 0.0, -0.40]
    max_accel: [0.30, 0.0, 0.80]
    max_decel: [-0.30, 0.0, -0.80]
    odom_topic: "__ROBONIX_ODOM_TOPIC__"
    odom_duration: 0.20
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - smoother_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
