manifestVersion: 1
name: robonix-go2-deploy

catalog:
  name: robonix.robot.unitree.go2
  version: 0.1.0
  description: Safe Robonix deployment for Unitree Go2 with mapping, semantic navigation and read-only UI.
  license: Apache-2.0 AND BSD-3-Clause AND MIT AND (EPL-2.0 OR EDL-1.0)
  tags: [robot, deploy, unitree, go2, quadruped, lidar, camera, imu, mapping, navigation, speech]
  maintainers:
    - Origamii520 <Origamii520@users.noreply.github.com>

env:
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  ROBONIX_PROVIDER_BIND_HOST: 127.0.0.1
  ROBONIX_ADVERTISE_HOST: 127.0.0.1
  SPEECH_BIND_ADDR: 127.0.0.1
  MAPPING_ENABLE_VIZ: "false"
  ROBONIX_SCENE_ROS_DISTRO: humble
  SCENE_MAP_ID: "${GO2_MAP_ID}"
  # Scene's Docker launcher mounts this host directory at /data/robonix.
  # Keep object memory, graph cache and annotations on their in-container
  # defaults so every item is persisted by that one audited mount.
  SCENE_DATA_DIR: ${ROBONIX_DEPLOY_DIR}/rbnx-build/data/scene
  MAPPING_MAPS_DIR: ${ROBONIX_DEPLOY_DIR}/rbnx-build/data/maps
  SPEECH_BACKEND: "${SPEECH_BACKEND}"

system:
  atlas: {listen: 127.0.0.1:50051, log: info}
  executor: {listen: 127.0.0.1:50061, log: info}
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  liaison: {listen: 127.0.0.1:50081, log: info}
  soma:
    listen: 127.0.0.1:50091
    provider_id: soma
    robot_yaml: ${ROBONIX_DEPLOY_DIR}/soma.yaml
    log: info
  scene:
    log: info
    web_port: 0
    # Keep observations absent: Scene's reconciler discovers primitives and
    # mapping outputs after their lifecycle providers come online.

primitive:
  - name: go2_chassis
    path: ${ROBONIX_DEPLOY_DIR}/packages/go2_chassis
    config:
      state_topic: /sportmodestate
      state_fallback_topic: /lf/sportmodestate
      twist_in_topic: /cmd_vel
      odom_topic: /odom
      imu_topic: /imu/data
      odom_frame: odom
      base_frame: base_link
      imu_frame: imu
      velocity_frame: odom
      network_interface: ${GO2_NETWORK_INTERFACE}
      allow_motion: ${GO2_ALLOW_MOTION}
      operator_present: ${GO2_OPERATOR_PRESENT}
      safety_ack: ${GO2_SAFETY_ACK}
      # Impossible sentinel. Only GO2_ALLOWED_MODES from a completed read-only
      # audit may replace it inside the fail-closed provider at runtime.
      allowed_modes: [255]
      max_linear_x_mps: 0.25
      max_linear_y_mps: 0.0
      max_angular_z_rps: 0.40
      max_linear_accel_mps2: 0.30
      max_angular_accel_rps2: 0.80
      command_timeout_s: 0.25
      state_timeout_s: 0.20
      zero_preamble_s: 0.50

  - name: go2_sensors
    path: ${ROBONIX_DEPLOY_DIR}/packages/go2_sensors
    config:
      network_interface: ${GO2_NETWORK_INTERFACE}
      lidar_input_topic: /utlidar/cloud
      lidar_output_topic: /scanner/cloud
      imu_input_topic: /imu/data
      imu_output_topic: /scanner/imu
      camera_topic: /camera/color/image_raw
      camera_info_topic: /camera/color/camera_info
      camera_frame: front_camera
      camera_fps: 10.0

  - name: robot_description
    path: ${ROBONIX_DEPLOY_DIR}/packages/go2_description

  - name: audio_client_bridge
    path: ${ROBONIX_SOURCE_PATH}/examples/webots/primitives/audio_client_bridge
    config:
      transport: reverse
      listen_host: 127.0.0.1
      listen_port: 60002

service:
  - name: mapping
    url: https://github.com/syswonder/service-map-rbnx
    branch: main
    config:
      algo: rtabmap
      base_frame: base_link
      odom_frame: odom
      use_sim_time: false
      webui_port: 0
      map_id: "${GO2_MAP_ID}"
      map_mode: "${GO2_MAP_MODE}"
      # Keep deskew disabled until the read-only PointCloud2 audit proves a
      # usable per-point timestamp field on this exact Go2 firmware/edition.
      deskew_lidar: false
      params_file: config/rtabmap_params.yaml
      rtabmap_inputs: [lidar, imu, odom]
      sensor_providers:
        lidar3d: go2_sensors
        imu: go2_sensors
        odom: go2_chassis

  - name: speech
    path: ${ROBONIX_SOURCE_PATH}/services/speech
    config:
      speech_backend: "${SPEECH_BACKEND}"
      disable_whisper: true
      funasr_model: paraformer-zh-streaming
      funasr_device: auto
      tts_voice: zh-CN-XiaoxiaoNeural
      default_speaker_provider_id: audio_client_bridge
      wake_words: ["罗伯尼克斯", "罗伯特"]

  - name: nav2
    url: https://github.com/syswonder/service-navigation-rbnx
    branch: main
    config:
      params_file: config/nav2_params_go2.yaml
      bt_xml_file: config/navigate.xml
      use_sim_time: false
      action_wait_s: 90.0
      provider_ids:
        map: mapping
        odom: go2_chassis
        # Pin the optional LaserScan lookup too. This provider intentionally
        # has no native scan, so Navigation projects its pinned lidar3d cloud
        # instead of accidentally selecting another robot's scan provider.
        scan: go2_sensors
        scan_cloud: go2_sensors
      scan_projection:
        enabled: true
        target_frame: base_link
        # base_link is the body-centred URDF frame. Retain low obstacles below
        # it while rejecting most floor returns and overhead clearance.
        min_height_m: -0.25
        max_height_m: 0.50
        range_max_m: 12.0
        # Soma already supplies a conservative circumscribed footprint. A
        # large radial margin creates a dangerous close-obstacle blind annulus.
        self_filter_margin_m: 0.02
        transform_tolerance_s: 0.20
        # Same evidence gate as Mapping: projection works without deskewing.
        deskewing: false
        deskew_fixed_frame: odom
      # Must not exceed the SimpleGoalChecker XY window in Nav2 params.
      guard_terminal_xy_m: 0.20
      guard_terminal_timeout_s: 12.0
      guard_no_progress_s: 3.0
      guard_global_spin_timeout_s: 18.0
      guard_global_spin_limit_rad: 4.20

  - name: go2_dashboard
    path: ${ROBONIX_DEPLOY_DIR}/packages/go2_dashboard
    config:
      host: 127.0.0.1
      port: ${GO2_DASHBOARD_PORT}
      camera_topic: /camera/color/image_raw
      cloud_topic: /scanner/cloud
      scan_topic: /scanner/scan
      map_topic: /map
      odom_topic: /odom
      map_frame: map
      base_frame: base_link

skill:
  - name: semantic_navigation
    path: ${ROBONIX_DEPLOY_DIR}/packages/semantic_navigation
    config:
      landmarks_file: ${SEMANTIC_LANDMARKS_FILE}
      expected_map_id: "${GO2_MAP_ID}"
      navigation_provider_id: nav2
      mapping_provider_id: mapping
      require_verified: true
      rpc_timeout_s: 10.0
      lifecycle_wait_s: 10.0
      # Retries bridge Navigation's async goal-handle acceptance race while a
      # lifecycle change is forcing an unfinished semantic run to cancel.
      cancel_retry_s: 3.0
      # Display metadata only. The skill validates a literal loopback IP,
      # exact path, no credentials/query/redirects, and isolates failures on a
      # daemon worker; this endpoint cannot create navigation or ROS commands.
      status_endpoint: "http://127.0.0.1:${GO2_DASHBOARD_PORT}/api/semantic-task"
      status_timeout_s: 0.5
      nav_status_poll_s: 0.5
