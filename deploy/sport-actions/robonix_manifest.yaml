manifestVersion: 1
name: robonix-go2-sport-actions-dedicated

# Run this profile instead of the navigation/following profile. The Skill owns
# the SDK daemon only when an action is requested; no Nav2 chassis writer runs.
env:
  ROBONIX_PROVIDER_BIND_HOST: 127.0.0.1
  ROBONIX_ADVERTISE_HOST: 127.0.0.1
  SPEECH_BIND_ADDR: 127.0.0.1

system:
  atlas: {listen: '127.0.0.1:50051', log: info}
  executor: {listen: '127.0.0.1:50061', log: info}
  pilot:
    listen: '127.0.0.1:50071'
    log: info
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  liaison: {listen: '127.0.0.1:50081', log: info}
  soma:
    listen: '127.0.0.1:50091'
    robot_yaml: ${ROBONIX_DEPLOY_DIR}/deploy/sport-actions/soma.yaml
    log: info

primitive:
  - name: audio_client_bridge
    path: ${ROBONIX_AUDIO_BRIDGE_PATH}
    config:
      transport: reverse
      listen_host: 127.0.0.1
      listen_port: 60002

service:
  - name: unitree_go2_sport_runtime
    path: ${ROBONIX_DEPLOY_DIR}/packages/go2_sport_actions
    manifest: package_manifest.runtime.yaml
    config:
      backend: managed
      daemon_socket: ${GO2_SDK_SOCKET}
      daemon_binary: ${ROBONIX_DEPLOY_DIR}/packages/go2_chassis/rbnx-build/sdk/install/bin/go2_sport_daemon
      network_interface: ${GO2_NETWORK_INTERFACE}
      dance_variants: [dance_1, dance_2]
  - name: speech
    path: ${ROBONIX_SPEECH_PATH}
    config:
      speech_backend: local
      disable_whisper: true
      funasr_model: ${FUNASR_MODEL_DIR}
      funasr_device: cpu
      default_speaker_provider_id: audio_client_bridge
      wake_words: ["罗伯尼克斯", "罗伯特"]

skill:
  # 宇树 Go2 打招呼；同一代码包，不复制实现。
  - name: unitree_go2_hello
    path: ${ROBONIX_DEPLOY_DIR}/packages/go2_sport_actions
    manifest: package_manifest.hello.yaml
    config: {action: hello, runtime_provider_id: unitree_go2_sport_runtime}
  # 宇树 Go2 伸展；同一代码包，不复制实现。
  - name: unitree_go2_stretch
    path: ${ROBONIX_DEPLOY_DIR}/packages/go2_sport_actions
    manifest: package_manifest.stretch.yaml
    config: {action: stretch, runtime_provider_id: unitree_go2_sport_runtime}
  # 宇树 Go2 拜年；同一代码包，不复制实现。
  - name: unitree_go2_new_year_greeting
    path: ${ROBONIX_DEPLOY_DIR}/packages/go2_sport_actions
    manifest: package_manifest.new_year_greeting.yaml
    config: {action: new_year_greeting, runtime_provider_id: unitree_go2_sport_runtime}
  # 宇树 Go2 卧倒再起身；同一代码包，不复制实现。
  - name: unitree_go2_crouch
    path: ${ROBONIX_DEPLOY_DIR}/packages/go2_sport_actions
    manifest: package_manifest.crouch.yaml
    config: {action: crouch, runtime_provider_id: unitree_go2_sport_runtime}
  # 宇树 Go2 跳舞；同一代码包，不复制实现。
  - name: unitree_go2_dance
    path: ${ROBONIX_DEPLOY_DIR}/packages/go2_sport_actions
    manifest: package_manifest.dance.yaml
    config: {action: dance, runtime_provider_id: unitree_go2_sport_runtime}
  # 宇树 Go2 原地倒立；同一代码包，不复制实现。
  - name: unitree_go2_handstand
    path: ${ROBONIX_DEPLOY_DIR}/packages/go2_sport_actions
    manifest: package_manifest.handstand.yaml
    config: {action: handstand, runtime_provider_id: unitree_go2_sport_runtime}
  # 宇树 Go2 倒立前进；同一代码包，不复制实现。
  - name: unitree_go2_handstand_walk
    path: ${ROBONIX_DEPLOY_DIR}/packages/go2_sport_actions
    manifest: package_manifest.handstand_walk.yaml
    config: {action: handstand_walk, runtime_provider_id: unitree_go2_sport_runtime}
